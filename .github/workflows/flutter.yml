name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "updates/latest.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-release
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ASTRA APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [[ -z "$latest" ]]; then
            latest="v1.0.0"
          fi
          version="${latest#v}"
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          next="${major}.${minor}.${patch}"
          echo "VERSION=$next" >> "$GITHUB_ENV"
          echo "TAG=v$next" >> "$GITHUB_ENV"
          echo "Next ASTRA release: v$next"

      - name: Set Flutter package version to release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          sed -i -E "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/astra-pubspec.yaml
            cp -R lib /tmp/astra-lib
            flutter create --platforms=android --project-name jarvis --org com.astra .
            cp /tmp/astra-pubspec.yaml pubspec.yaml
            rm -rf lib
            cp -R /tmp/astra-lib lib
          fi


      - name: Install native Hey Astra foreground service
        run: |
          mkdir -p android/app/src/main/kotlin/com/astra/jarvis
          cat > android/app/src/main/kotlin/com/astra/jarvis/MainActivity.kt <<'KOTLIN'
          package com.astra.jarvis

          import android.content.Intent
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.astra.jarvis/wake"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startWakeService" -> {
                              val service = Intent(this, AstraWakeService::class.java)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(service) else startService(service)
                              result.success(null)
                          }
                          "stopWakeService" -> {
                              stopService(Intent(this, AstraWakeService::class.java))
                              result.success(null)
                          }
                          "consumeWakeIntent" -> {
                              val detected = intent?.getBooleanExtra("astra_wake_detected", false) == true
                              if (detected) intent?.removeExtra("astra_wake_detected")
                              result.success(detected)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
              }
          }
          KOTLIN
          cat > android/app/src/main/kotlin/com/astra/jarvis/AstraWakeService.kt <<'KOTLIN'
          package com.astra.jarvis

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
                    import java.util.Locale

          class AstraWakeService : Service() {
              private val handler = Handler(Looper.getMainLooper())
              private var recognizer: SpeechRecognizer? = null
              private var stopping = false
              private val channelId = "astra_wake_service"
              private val notificationId = 6108

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  val openApp = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP
                  }
                  val pending = PendingIntent.getActivity(this, 0, openApp,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, channelId) else Notification.Builder(this)
                  val notification: Notification = builder
                      .setSmallIcon(applicationInfo.icon)
                      .setContentTitle("ASTRA écoute « Hey Astra »")
                      .setContentText("Micro actif. Appuie pour ouvrir ASTRA et gérer l’écoute.")
                      .setContentIntent(pending)
                      .setOngoing(true)
                      .setCategory(Notification.CATEGORY_SERVICE)
                      .build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(notificationId, notification, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(notificationId, notification)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  stopping = false
                  startRecognition()
                  return START_STICKY
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Écoute Hey Astra", NotificationManager.IMPORTANCE_LOW)
                      channel.description = "Indique quand ASTRA écoute la phrase de réveil."
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun startRecognition() {
                  if (stopping || !SpeechRecognizer.isRecognitionAvailable(this)) return
                  try {
                      recognizer?.destroy()
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                      recognizer?.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: android.os.Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onError(error: Int) { scheduleRestart() }
                          override fun onResults(results: android.os.Bundle?) {
                              if (checkPhrase(results)) return
                              scheduleRestart()
                          }
                          override fun onPartialResults(partialResults: android.os.Bundle?) { checkPhrase(partialResults) }
                          override fun onEvent(eventType: Int, params: android.os.Bundle?) {}
                      })
                      val speechIntent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "fr-FR")
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "fr-FR")
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                          putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                      }
                      recognizer?.startListening(speechIntent)
                  } catch (_: Exception) { scheduleRestart() }
              }

              private fun checkPhrase(bundle: android.os.Bundle?): Boolean {
                  val phrases = bundle?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION) ?: return false
                  val found = phrases.any { it.lowercase(Locale.ROOT).replace("’", "'").contains(Regex("\\bhey\\s+astra\\b")) }
                  if (found && !stopping) {
                      stopping = true
                      handler.removeCallbacksAndMessages(null)
                      try { recognizer?.cancel(); recognizer?.destroy() } catch (_: Exception) {}
                      recognizer = null
                      val launch = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP
                          putExtra("astra_wake_detected", true)
                      }
                      startActivity(launch)
                      stopSelf()
                      return true
                  }
                  return false
              }

              private fun scheduleRestart() {
                  if (!stopping) handler.postDelayed({ startRecognition() }, 1200)
              }

              override fun onDestroy() {
                  stopping = true
                  handler.removeCallbacksAndMessages(null)
                  try { recognizer?.cancel(); recognizer?.destroy() } catch (_: Exception) {}
                  recognizer = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          KOTLIN
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          permissions = {
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECORD_AUDIO",
          }
          existing = {e.get(f"{{{ns}}}name") for e in root.findall("uses-permission")}
          for permission in permissions - existing:
              e = ET.Element("uses-permission", {f"{{{ns}}}name": permission})
              root.insert(0, e)
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest application element missing")
          service_name = ".AstraWakeService"
          service = next((e for e in app.findall("service") if e.get(f"{{{ns}}}name") == service_name), None)
          if service is None:
              service = ET.SubElement(app, "service")
          service.set(f"{{{ns}}}name", service_name)
          service.set(f"{{{ns}}}enabled", "true")
          service.set(f"{{{ns}}}exported", "false")
          service.set(f"{{{ns}}}foregroundServiceType", "microphone")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY

      - name: Lock ASTRA Android package identity
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          s = gradle.read_text()
          s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.astra.jarvis"', s, count=1)
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.astra.jarvis"', s, count=1)
          if 'namespace = "com.astra.jarvis"' not in s or 'applicationId = "com.astra.jarvis"' not in s:
              raise SystemExit("Unable to lock ASTRA package identity to com.astra.jarvis.")
          gradle.write_text(s)
          print("ASTRA package locked to com.astra.jarvis.")
          PY

      - name: Set ASTRA app label and permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest: application element missing")
          app.set(f"{{{ns}}}label", "ASTRA")
          required = {
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          }
          present = {
              p.get(f"{{{ns}}}name")
              for p in root.findall("uses-permission")
          }
          for name in required - present:
              element = ET.Element("uses-permission")
              element.set(f"{{{ns}}}name", name)
              root.insert(0, element)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Configure permanent ASTRA release signing (required)
        env:
          ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        run: |
          set -e
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path
          raw = os.getenv("ASTRA_KEYSTORE_BASE64", "")
          encoded = re.sub(r"\s+", "", raw)
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception:
              raise SystemExit("ASTRA_KEYSTORE_BASE64 is missing or invalid.")
          if not decoded:
              raise SystemExit("ASTRA_KEYSTORE_BASE64 is empty.")
          store_password = os.getenv("ASTRA_KEYSTORE_PASSWORD", "")
          key_password = os.getenv("ASTRA_KEY_PASSWORD", "")
          alias = os.getenv("ASTRA_KEY_ALIAS", "").strip() or "astra"
          if not store_password or not key_password:
              raise SystemExit("Missing ASTRA_KEYSTORE_PASSWORD or ASTRA_KEY_PASSWORD secret.")
          Path("android/app/astra-release.jks").write_bytes(decoded)
          gradle_path = Path("android/app/build.gradle.kts")
          if not gradle_path.exists():
              raise SystemExit("android/app/build.gradle.kts was not generated.")
          gradle = gradle_path.read_text()
          signing_lines = [
              "    signingConfigs {",
              '        create("astraRelease") {',
              '            storeFile = file("astra-release.jks")',
              '            storePassword = System.getenv("ASTRA_KEYSTORE_PASSWORD")',
              '            keyAlias = System.getenv("ASTRA_KEY_ALIAS").takeUnless { it.isNullOrBlank() } ?: "astra"',
              '            keyPassword = System.getenv("ASTRA_KEY_PASSWORD")',
              "        }",
              "    }",
          ]
          signing_block = "\n".join(signing_lines)
          if 'create("astraRelease")' not in gradle:
              gradle = gradle.replace("android {", "android {\n" + signing_block, 1)
          gradle = gradle.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("astraRelease")'
          )
          if 'signingConfig = signingConfigs.getByName("astraRelease")' not in gradle:
              raise SystemExit("Release build type was not connected to ASTRA signing.")
          gradle_path.write_text(gradle)
          print("Persistent ASTRA release signing configured.")
          PY
          keytool -list -keystore android/app/astra-release.jks -storepass "$ASTRA_KEYSTORE_PASSWORD" -alias "${ASTRA_KEY_ALIAS:-astra}" >/dev/null
          echo "ASTRA release keystore verified."

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and prepare APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" ASTRA.apk
          sha256sum ASTRA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-${{ env.TAG }}-APK
          path: ASTRA.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: ASTRA ${{ env.TAG }}
          generate_release_notes: true
          files: ASTRA.apk

      - name: Update ASTRA update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ env.VERSION }}
          TAG: ${{ env.TAG }}
        run: |
          export SHA256="$(sha256sum ASTRA.apk | awk '{print $1}')"
          python3 - <<'PY'
          import json, os
          manifest = {
              "version": os.environ["VERSION"],
              "apk_url": f"https://github.com/leoblanchart92-hub/Jarvis/releases/download/{os.environ['TAG']}/ASTRA.apk",
              "sha256": os.environ["SHA256"],
              "notes": f"ASTRA {os.environ['TAG']}"
          }
          os.makedirs("updates", exist_ok=True)
          with open("updates/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ASTRA update manifest for $TAG"
            git push origin HEAD:main
          else
            echo "ASTRA update manifest already up to date."
          fi
