name: Build and publish ASTRA APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 1.0.2). Laisser vide pour pubspec.yaml."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/RELEASE_NOW"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 -c "import re; s=open('pubspec.yaml').read(); m=re.search(r'^version:\s*([0-9]+\\.[0-9]+\\.[0-9]+)',s,re.M); print(m.group(1) if m else '')")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name jarvis --org com.astra .
          fi

      - name: Add install permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permission='    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
          if permission.strip() not in s:
              s=s.replace("<manifest", "<manifest", 1)
              s=s.replace("<application", permission+"    <application", 1)
              p.write_text(s)
          PY

      - name: Configure ASTRA release signing (one user password)
        env:
          ASTRA_SIGNING_KEY: ${{ secrets.ASTRA_SIGNING_KEY }}
        run: |
          set -e
          python3 - <<'PY'
          import os, base64, json, re, subprocess, uuid
          from pathlib import Path

          raw = os.getenv("ASTRA_SIGNING_KEY", "").strip()
          if not raw:
              raise SystemExit("ASTRA_SIGNING_KEY secret is missing.")
          try:
              data = json.loads(raw)
              encoded = re.sub(r"\s+", "", data["keystore_base64"])
              decoded = base64.b64decode(encoded, validate=True)
              password = data["password"]
              alias = data.get("alias", "astra").strip() or "astra"
          except Exception:
              raise SystemExit("ASTRA_SIGNING_KEY is invalid. Recreate it with the ASTRA PowerShell script.")
          if not decoded or not password:
              raise SystemExit("ASTRA_SIGNING_KEY is missing the keystore or password.")

          keystore = Path("android/app/astra-release.jks")
          keystore.write_bytes(decoded)

          gradle_path = Path("android/app/build.gradle.kts")
          if not gradle_path.exists():
              raise SystemExit("android/app/build.gradle.kts was not generated.")
          gradle = gradle_path.read_text()
          signing_lines = [
              "    signingConfigs {",
              '        create("astraRelease") {',
              '            storeFile = file("astra-release.jks")',
              '            storePassword = System.getenv("ASTRA_SIGNING_PASSWORD")',
              '            keyAlias = System.getenv("ASTRA_SIGNING_ALIAS") ?: "astra"',
              '            keyPassword = System.getenv("ASTRA_SIGNING_PASSWORD")',
              "        }",
              "    }",
          ]
          if 'create("astraRelease")' not in gradle:
              gradle = gradle.replace("android {", "android {\n" + "\\n".join(signing_lines), 1)
          gradle = gradle.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("astraRelease")'
          )
          if 'signingConfig = signingConfigs.getByName("astraRelease")' not in gradle:
              raise SystemExit("Release build type was not connected to ASTRA signing.")
          gradle_path.write_text(gradle)

          delimiter = "ASTRA_" + uuid.uuid4().hex
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, value in (("ASTRA_SIGNING_PASSWORD", password), ("ASTRA_SIGNING_ALIAS", alias)):
                  f.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")

          subprocess.run([
              "keytool", "-list", "-keystore", str(keystore),
              "-storepass", password, "-alias", alias
          ], check=True, stdout=subprocess.DEVNULL)
          print("ASTRA signing key verified.")
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk ASTRA.apk
          test -s ASTRA.apk
          sha256sum ASTRA.apk

      - name: Prepare update manifest
        env:
          APK_SHA256: ${{ env.APK_SHA256 }}
        run: |
          SHA256="$(sha256sum ASTRA.apk | awk '{print $1}')"
          python3 - <<'PY'
          import json, os
          version=os.environ["VERSION"]
          tag=os.environ["TAG"]
          sha=os.popen("sha256sum ASTRA.apk").read().split()[0]
          manifest={
            "version":version,
            "apk_url":f"https://github.com/leoblanchart92-hub/Jarvis/releases/download/{tag}/ASTRA.apk",
            "sha256":sha,
            "notes":f"ASTRA {tag}"
          }
          os.makedirs("updates",exist_ok=True)
          with open("updates/latest.json","w",encoding="utf-8") as f:
            json.dump(manifest,f,ensure_ascii=False,separators=(",",":"))
            f.write("\n")
          PY

      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: ASTRA ${{ env.TAG }}
          generate_release_notes: true
          files: ASTRA.apk

      - name: Publish manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if git diff --cached --quiet; then
            echo "Manifest already current"
          else
            git commit -m "Update ASTRA manifest for $TAG"
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-${{ env.TAG }}-APK
          path: ASTRA.apk
          if-no-files-found: error
          retention-days: 14
